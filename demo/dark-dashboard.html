<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Nebula Analytics — Dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1115; color: #e6eaf2; min-height: 100vh;
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
  }
  aside {
    width: 208px; flex: none; background: #17181d; padding: 20px 14px;
    border-right: 1px solid #202229;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; padding: 0 6px 18px; }
  .logo .dot { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, #5686fe, #8b5cf6); }
  nav a {
    display: flex; align-items: center; gap: 10px; color: #8a92a3; text-decoration: none;
    padding: 8px 10px; border-radius: 8px; margin-bottom: 2px; font-size: 13px;
  }
  nav a.on { background: rgba(86, 134, 254, 0.14); color: #cdd9ff; }
  nav a .ic { width: 14px; height: 14px; border-radius: 4px; background: #2a2c35; flex: none; }
  main { flex: 1; padding: 24px 28px; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .topbar h1 { font-size: 20px; font-weight: 650; }
  .topbar .search {
    background: #1a1c22; border: 1px solid #262833; border-radius: 10px;
    padding: 7px 14px; color: #8a92a3; font-size: 13px; width: 220px;
  }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .card {
    background: #191b21; border: 1px solid #24262e; border-radius: 12px; padding: 16px;
  }
  .card .k { color: #8a92a3; font-size: 12px; }
  .card .v { font-size: 26px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .card .d { color: #4ade80; font-size: 12px; margin-top: 4px; }
  .panels { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; }
  .panel {
    background: #191b21; border: 1px solid #24262e; border-radius: 12px; padding: 18px;
  }
  .panel h3 { font-size: 14px; margin-bottom: 14px; color: #c3cad6; }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 150px; padding-top: 10px; }
  .bars .b { flex: 1; border-radius: 5px 5px 0 0; background: linear-gradient(180deg, #5686fe, #2b4fa8); }
  .bars .b:nth-child(2n) { background: linear-gradient(180deg, #8b5cf6, #5b21b6); }
  .rows .r { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #20232b; }
  .rows .r:last-child { border-bottom: none; }
  .rows .av { width: 26px; height: 26px; border-radius: 50%; background: #26304d; flex: none; }
  .rows .t { flex: 1; font-size: 13px; }
  .rows .s { color: #8a92a3; font-size: 12px; }
</style>
</head>
<body>
  <aside>
    <div class="logo"><span class="dot"></span>Nebula</div>
    <nav>
      <a class="on"><span class="ic"></span>概览</a>
      <a><span class="ic"></span>分析</a>
      <a><span class="ic"></span>项目</a>
      <a><span class="ic"></span>成员</a>
      <a><span class="ic"></span>设置</a>
    </nav>
  </aside>
  <main>
    <div class="topbar">
      <h1>数据概览</h1>
      <div class="search">搜索…</div>
    </div>
    <div class="cards">
      <div class="card"><div class="k">月活跃用户</div><div class="v">48,201</div><div class="d">↑ 12.4%</div></div>
      <div class="card"><div class="k">消息数</div><div class="v">128,934</div><div class="d">↑ 8.1%</div></div>
      <div class="card"><div class="k">工具调用</div><div class="v">19,672</div><div class="d">↑ 23.7%</div></div>
      <div class="card"><div class="k">平均响应</div><div class="v">1.2s</div><div class="d">↓ 0.3s</div></div>
    </div>
    <div class="panels">
      <div class="panel">
        <h3>近 30 天趋势</h3>
        <div class="bars">
          <div class="b" style="height:34%"></div><div class="b" style="height:52%"></div>
          <div class="b" style="height:41%"></div><div class="b" style="height:64%"></div>
          <div class="b" style="height:58%"></div><div class="b" style="height:76%"></div>
          <div class="b" style="height:69%"></div><div class="b" style="height:88%"></div>
          <div class="b" style="height:80%"></div><div class="b" style="height:96%"></div>
        </div>
      </div>
      <div class="panel">
        <h3>活跃成员</h3>
        <div class="rows">
          <div class="r"><div class="av"></div><div class="t">Luna Chen</div><div class="s">在线</div></div>
          <div class="r"><div class="av"></div><div class="t">Marcus Wei</div><div class="s">在线</div></div>
          <div class="r"><div class="av"></div><div class="t">Aria Lin</div><div class="s">3 分钟前</div></div>
          <div class="r"><div class="av"></div><div class="t">Kai Zhang</div><div class="s">12 分钟前</div></div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
