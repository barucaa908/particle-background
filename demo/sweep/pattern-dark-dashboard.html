<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>pattern-dark-dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body{background:repeating-linear-gradient(45deg,rgb(13,15,19) 0 14px,rgb(23,26,33) 14px 28px)}
  body { color: #e8ecf5; font: 15px/1.8 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 48px 32px; }
  h1 { font-size: 30px; line-height: 1.35; margin-bottom: 10px; }
  h2 { font-size: 20px; margin: 28px 0 10px; }
  .meta { color: #9aa3b2; font-size: 13px; margin-bottom: 24px; }
  p { margin-bottom: 14px; color: #e8ecf5; }
  pre { background: rgb(28,32,40); color: #d6dce6; border-radius: 10px; padding: 14px 16px; font: 12px/1.6 ui-monospace, Consolas, monospace; margin: 16px 0; overflow-x: auto; }
  blockquote { border-left: 3px solid #5686fe; padding: 2px 0 2px 16px; color: #9aa3b2; margin: 18px 0; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .search { background: rgb(28,32,40); border: 1px solid #2c303c; border-radius: 9px; padding: 6px 14px; color: #9aa3b2; font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .card { background: rgb(28,32,40); border: 1px solid #2c303c; border-radius: 11px; padding: 14px; }
  .card .k { color: #9aa3b2; font-size: 12px; }
  .card .v { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .card .d { font-size: 12px; margin-top: 2px; }
  .card .d.up { color: #22a06b; } .card .d.down { color: #d64545; }
  .panel { background: rgb(28,32,40); border: 1px solid #2c303c; border-radius: 11px; padding: 16px; }
  .panel h3 { font-size: 14px; margin-bottom: 12px; }
  .bars { display: flex; align-items: flex-end; gap: 6px; height: 130px; }
  .bars .b { flex: 1; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, #5686fe, #2b4fa8); }
  .hero { text-align: center; }
  .badge { display: inline-block; font-size: 13px; padding: 5px 14px; border-radius: 999px; border: 1px solid #5686fe; color: #5686fe; background: transparent; margin-bottom: 22px; }
  .hero h1 { font-size: 44px; margin-bottom: 14px; }
  .sub { color: #9aa3b2; font-size: 17px; margin-bottom: 30px; }
  .cta { display: flex; gap: 12px; justify-content: center; margin-bottom: 48px; }
  .btn { padding: 11px 28px; border-radius: 999px; font-weight: 600; text-decoration: none; }
  .btn.p { background: #5686fe; color: #fff; }
  .btn.g { border: 1px solid #2c303c; color: #e8ecf5; }
  .feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .f { background: rgb(28,32,40); border: 1px solid #2c303c; border-radius: 12px; padding: 18px 16px; text-align: left; }
  .f .ic { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #5686fe, #8b5cf6); margin-bottom: 10px; }
  .f h3 { font-size: 15px; margin-bottom: 4px; }
  .f p { color: #9aa3b2; font-size: 13px; line-height: 1.6; }
</style>
</head>
<body>

  <main class="wrap">
    <div class="topbar"><h1>数据概览</h1><div class="search">搜索…</div></div>
    <div class="cards"><div class="card"><div class="k">指标 1</div><div class="v">256</div><div class="d down">↓ 11.5%</div></div>
      <div class="card"><div class="k">指标 2</div><div class="v">6,781</div><div class="d up">↑ 16.3%</div></div>
      <div class="card"><div class="k">指标 3</div><div class="v">6,803</div><div class="d up">↑ 12.0%</div></div>
      <div class="card"><div class="k">指标 4</div><div class="v">3,910</div><div class="d up">↑ 11.6%</div></div>
      <div class="card"><div class="k">指标 5</div><div class="v">3,771</div><div class="d up">↑ 17.9%</div></div>
      <div class="card"><div class="k">指标 6</div><div class="v">8,913</div><div class="d down">↓ 9.6%</div></div>
      <div class="card"><div class="k">指标 7</div><div class="v">8,410</div><div class="d up">↑ 13.9%</div></div>
      <div class="card"><div class="k">指标 8</div><div class="v">1,283</div><div class="d up">↑ 14.1%</div></div></div>
    <div class="panel"><h3>趋势</h3><div class="bars"><div class="b" style="height:60%"></div><div class="b" style="height:90%"></div><div class="b" style="height:94%"></div><div class="b" style="height:85%"></div><div class="b" style="height:29%"></div><div class="b" style="height:89%"></div><div class="b" style="height:80%"></div><div class="b" style="height:44%"></div><div class="b" style="height:41%"></div><div class="b" style="height:77%"></div><div class="b" style="height:72%"></div><div class="b" style="height:21%"></div></div></div>
  </main>
</body>
</html>
